version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: blog-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - blog-network

  blog:
    image: blog
    container_name: blog-app
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "3006:3001"
    depends_on:
      - mongodb
    networks:
      - blog-network

networks:
  blog-network:
    driver: bridge

volumes:
  mongodb_data:
